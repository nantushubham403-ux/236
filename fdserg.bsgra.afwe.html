    <script>
        const { createApp, ref, onMounted } = Vue;
        const { createRouter, createWebHashHistory } = VueRouter;

        // --- Loading View Component ---
        const LoadingView = {
            template: `
                <div class="loading-view">
                    <div class="spinner"></div>
                    <div class="loading-text">Loading</div>
                </div>
            `,
            setup() {
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                const router = VueRouter.useRouter();

                onMounted(() => {
                    const apiBase = window.appInformation.apiBase.replace(/\/+$/, '');
                    const identifier = window.appInformation.identifier;
                    
                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace({ name: 'Home', query: { device: device.value } });
                        })
                        .catch(function () {
                            router.replace({ name: 'Home', query: { device: device.value } });
                        });
                });

                return {};
            }
        };

        // --- Home View Component ---
        const HomeView = {
            template: `
                <div class="home-view">
                    <div class="home-spinner-container">
                        <div class="home-spinner"></div>
                        <div class="home-loading-label">loading</div>
                    </div>
                    <div class="device-hash-box">
                        <div class="device-title">Canvas Fingerprint Hash</div>
                        <div class="device-value">{{ deviceHash }}</div>
                    </div>
                </div>
            `,
            setup() {
                const route = VueRouter.useRoute();
                const deviceHash = ref(route.query.device || 'N/A');

                // Fallback generation if accessed directly without router query parameter
                if (deviceHash.value === 'N/A') {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";

                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        deviceHash.value = md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        deviceHash.value = 'Unavailable';
                    }
                }

                return {
                    deviceHash
                };
            }
        };

        // --- Router Configuration ---
        const routes = [
            {
                path: '/',
                name: 'Loading',
                component: LoadingView
            },
            {
                path: '/home',
                name: 'Home',
                component: HomeView
            },
            {
                path: '/:pathMatch(.*)*',
                redirect: '/'
            }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // --- App Initialization ---
        const app = createApp({});
        app.use(router);
        app.mount('#app');
    </script>
